<!DOCTYPE html>
<html>
<head>
    <title>Рельеф - Leaflet preview</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <style>
        body {margin: 0;padding: 0;}
        html, body, #map {width: 100%;height: 100%;}
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([51.9319, 85.9736], 13);
        
        // ПРАВИЛЬНАЯ ССЫЛКА НА ТАЙЛЫ НА GITHUB
        // ВАЖНО: замените 'RELEF' на точное название вашей папки с тайлами
        var reliefLayer = L.tileLayer('https://raw.githubusercontent.com/ekrss04/Data-/main/RELEF/{z}/{x}/{y}.png', {
            minZoom: 4,
            maxZoom: 16,
            attribution: 'Рельеф: данные QGIS'
        }).addTo(map);
    </script>
</body>
</html>
